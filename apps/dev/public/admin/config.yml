# Decap CMS for atreyakamat.dev — https://decapcms.org/docs/
# Login: GitHub via Netlify's OAuth provider (one-time setup in content/README.md).
# Saving a post commits a markdown file to content/posts/ on main; Netlify rebuilds the site.

backend:
  name: github
  repo: atreyakamat/atreyaportfolio
  branch: main
  base_url: https://api.netlify.com
  auth_endpoint: auth
  commit_messages:
    create: "blog: add {{slug}}"
    update: "blog: update {{slug}}"
    delete: "blog: delete {{slug}}"
    uploadMedia: "blog: upload {{path}}"
    deleteMedia: "blog: delete {{path}}"

# Drafts and reviews become pull requests until you hit "Publish".
publish_mode: editorial_workflow

site_url: https://atreyakamat.dev
display_url: https://atreyakamat.dev
logo_url: https://atreyakamat.dev/icon.svg

media_folder: apps/dev/public/uploads
public_folder: /uploads

collections:
  - name: posts
    label: Posts
    label_singular: Post
    description: >-
      Articles at atreyakamat.dev/blog. SEO checklist: title under 60 characters with the main
      keyword (e.g. "website developer in Goa"); description 120-155 characters; one idea per
      "## heading"; link to the matching service page; add 2-4 FAQs if people ask follow-up questions.
    folder: apps/dev/content/posts
    create: true
    slug: "{{slug}}"
    extension: md
    format: frontmatter
    preview_path: "blog/{{slug}}/"
    summary: "{{title}} — {{date}}{{draft}}"
    sortable_fields: [date, title]
    fields:
      - label: Title
        name: title
        widget: string
        hint: "Under 60 characters. Put the main search phrase first, e.g. 'How much does a website cost in Goa?'"
      - label: URL slug
        name: slug
        widget: string
        pattern: ["^[a-z0-9]+(-[a-z0-9]+)*$", "Lowercase words joined by hyphens, e.g. villa-website-goa"]
        hint: "Becomes atreyakamat.dev/blog/<slug>/. Never change it after publishing (old links would break)."
      - label: Meta description
        name: description
        widget: text
        pattern: ["^.{50,160}$", "Aim for 120-155 characters"]
        hint: "Shown in Google results and link previews. 120-155 characters, plain language, include the keyword once."
      - label: Published date
        name: date
        widget: datetime
        format: YYYY-MM-DD
        date_format: YYYY-MM-DD
        time_format: false
      - label: Last updated
        name: updated
        widget: datetime
        format: YYYY-MM-DD
        date_format: YYYY-MM-DD
        time_format: false
        required: false
        hint: "Set this when you make a real update; Google shows it as the modified date."
      - label: Kicker
        name: kicker
        widget: string
        required: false
        hint: "Small label above the title, e.g. 'Websites · Pricing'. Defaults to the tags."
      - label: Tags
        name: tags
        widget: list
        allow_add: true
        default: []
        hint: "2-4 lowercase topics, e.g. websites, pricing."
      - label: Related service
        name: service
        widget: select
        default: none
        options:
          - { label: "Website development in Goa", value: website-development-goa }
          - { label: "Custom software in Goa", value: custom-software-development-goa }
          - { label: "AI & automation in Goa", value: ai-automation-goa }
          - { label: "None", value: none }
        hint: "The call-to-action box at the end links here. Pick the closest match."
      - label: Extra links in the call-to-action
        name: related
        widget: list
        required: false
        summary: "{{fields.label}}"
        fields:
          - { label: Label, name: label, widget: string }
          - { label: Link (e.g. /services/ai-automation-goa/), name: href, widget: string }
      - label: Cover image
        name: cover
        widget: image
        required: false
        hint: "Optional. 1200×630 works best; also used as the share image."
      - label: Cover image alt text
        name: coverAlt
        widget: string
        required: false
        hint: "Describe the image for people who can't see it."
      - label: Draft
        name: draft
        widget: boolean
        default: false
        hint: "Drafts are not built or listed."
      - label: FAQ
        name: faq
        widget: list
        required: false
        summary: "{{fields.q}}"
        hint: "Optional. Adds a Questions section and FAQ rich results in Google."
        fields:
          - { label: Question, name: q, widget: string }
          - { label: Answer, name: a, widget: text }
      - label: Body
        name: body
        widget: markdown
        hint: "Use '## ' for section headings (they build the table of contents). Link to your service page at least once."
