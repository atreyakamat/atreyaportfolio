<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="robots" content="noindex" />
  <title>Form detection</title>
</head>
<body>
  <!--
    Netlify Forms detects forms from deployed static HTML. The live form is a
    React component that POSTs to this file; field names here must match it.
  -->
  <form name="project-enquiry" data-netlify="true" netlify-honeypot="bot-field" hidden>
    <input type="hidden" name="form-name" value="project-enquiry" />
    <input name="bot-field" />
    <input type="text" name="name" />
    <input type="text" name="contact" />
    <input type="text" name="type" />
    <input type="text" name="timeline" />
    <textarea name="problem"></textarea>
  </form>
  <form name="project-pass" data-netlify="true" netlify-honeypot="bot-field" hidden>
    <input type="hidden" name="form-name" value="project-pass" />
    <input name="bot-field" />
    <input type="text" name="name" />
    <input type="text" name="business" />
    <input type="text" name="need" />
    <input type="text" name="pass" />
    <input type="text" name="contact" />
  </form>
</body>
</html>
