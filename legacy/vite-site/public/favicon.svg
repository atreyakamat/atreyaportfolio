<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <!-- Porcelain editorial background with crisp border -->
  <rect x="2" y="2" width="60" height="60" rx="14" fill="#F7F5EF" stroke="#151515" stroke-width="2.5" />
  
  <!-- Merged AK Monogram (Ink #151515) -->
  <!-- Letter A: Left slant to shared stem -->
  <line x1="16" y1="48" x2="34" y2="16" stroke="#151515" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" />
  
  <!-- Shared vertical spine: right of A & stem of K -->
  <line x1="34" y1="16" x2="34" y2="48" stroke="#151515" stroke-width="5" stroke-linecap="round" />
  
  <!-- A crossbar -->
  <line x1="23" y1="34" x2="34" y2="34" stroke="#151515" stroke-width="4.5" stroke-linecap="round" />
  
  <!-- K upper arm -->
  <line x1="34" y1="32" x2="48" y2="16" stroke="#151515" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" />
  
  <!-- K lower leg -->
  <line x1="34" y1="32" x2="48" y2="48" stroke="#151515" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" />

  <!-- Subtle editorial accent dot -->
  <circle cx="51" cy="13" r="3" fill="#32D6C5" />
</svg>